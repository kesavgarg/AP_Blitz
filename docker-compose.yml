# Local development database only. Bound to loopback so it is not reachable
# from other machines. Do not run this file on a public host.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apblitz
      POSTGRES_PASSWORD: apblitz
      POSTGRES_DB: apblitz
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - apblitz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apblitz -d apblitz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apblitz_pg:
